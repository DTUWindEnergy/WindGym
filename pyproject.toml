[build-system]
requires = ["setuptools>=60", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "WindGym"
dynamic = ["version"]
authors = [
  { name = "Marcus Nilsen", email = "manils@dtu.dk" },
  { name = "Julian Quick", email = "juqu@dtu.dk" },
  { name = "Ernestas Simutis", email = "ernim@dtu.dk" },
  { name = "Teodor Olof Benedict Åstrand", email = "tobas@dtu.dk" },
]
description = "Wind farm reinforcement learning environment"
readme = "README.md"
requires-python = ">=3.10, <3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "gymnasium>=1.0.0",
  "stable_baselines3",
  "hipersim>=0.1.7",
  "dynamiks==0.0.7",
  "pettingzoo",
  "wetb",
  "IPython",
  "numpy",
  "h5py",
  "netcdf4",
  "xarray>=2022.0.0,<2025",
  "wandb",
  "tensorboard",
  "tyro",
  "wetb",
]

[project.urls]
"Homepage" = "https://gitlab.windenergy.dtu.dk/sys/windgym"
"Bug Tracker" = "https://gitlab.windenergy.dtu.dk/sys/windgym/-/issues"

[project.optional-dependencies]
hawc2 = [
  "h2lib",
  ]
dev = [
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "pytest-xdist>=3.5.0",
  "jupyter",
]

[tool.setuptools]
packages = ["WindGym"]

[tool.setuptools_scm]
version_file = "WindGym/version.py"
version_scheme = "no-guess-dev"

[tool.pytest.ini_options]
testpaths = "tests"
addopts = "--cov-report term-missing:skip-covered --cov=WindGym"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring full environment setup",
    "unit: marks fast isolated unit tests (<5s)",
]

[tool.coverage.run]
omit = ["tests/*", "WindGym/version.py"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Match original pre-commit config: only ignore F401 (unused imports) and F841 (unused variables)
extend-ignore = ["F401", "F841"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
WindGym = { path = ".", editable = true }

[tool.pixi.dependencies]
hdf5 = "*"
h5py = "*"
netcdf4 = "*"
numpy = "*"
pytest = ">=8.3.4,<9"
pytest-cov = ">=6.0.0,<7"
pytest-xdist = ">=3.5.0,<4"
gymnasium = ">=1.0.0,<2"
xarray = ">=2022.0.0,<2025"
pytz = ">=2025.1,<2026"
jupyter = ">=1.1.1,<2"
wandb = ">=0.20.1,<0.21"
tensorboard = ">=2.19.0,<3"
tyro = ">=0.9.26,<0.10"
pip = ">=25.1.1,<26"

[tool.pixi.tasks]
install = { cmd = "pip install -e ." }
test = { depends-on = ["install"], cmd = "pytest" }
test-fast = { depends-on = ["install"], cmd = "pytest -m 'not slow' -n auto" }
test-slow = { depends-on = ["install"], cmd = "pytest -m slow" }

[tool.pixi.feature.lint.dependencies]
python = ">=3.10,<3.14"
pre-commit = ">=4.0.1,<5"


[tool.pixi.environments]
lint = { features = ["lint"], no-default-feature = true }
